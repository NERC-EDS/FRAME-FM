# configs/model/demonstrator_mmmae_large.yaml
# Scaled version of demonstrator_mmmae.yaml (~10x larger)
_target_: FRAME_FM.models.mmmae.MultimodalMaskedAutoencoder

# Inputs
input_shapes: [[64, 64]]              # Single 64x64 tile
n_channels: [10]                      # 10 bands
patch_shapes: [[8, 8]]                # Tokenise 8x8 patches
inputs_positioned: ["bounds"]         # Input positions are of tile bounds
position_space: [[0, 2e6], [0, 4e6]]  # Positions are all-numeric OSGB grid references

# Architecture (10x larger)
pos_embed_ratio: [1, 1]               # Use equi-dimensional coordinate embeddings
encoder_embed_dim: 128                # Embed inputs in 128D space (4x)
encoder_depth: 16                     # Encode with 16 attention layers (2x)
encoder_num_heads: 8                  # Encode with 8 attention heads per layer (2x)
decoder_embed_dim: 128                # Embed predictions in 128D space (4x)
decoder_depth: 8                      # Decode with 8 attention layers (2x)
decoder_num_heads: 8                  # Decode with 8 attention heads per layer (2x)
mlp_ratio: 4.                         # Use MLP layers 4x larger than embeddings

# Optimisation hyperparameters
learning_rate: 1e-3                   # Learning rate
default_mask_ratio: 0.75              # Train to reconstruct from 25% of token embeddings
