# Publish to the test PyPI repository on tagged releases (v*.*.*)
# Using pypi-publish action with trusted publishing to avoid the need for a secret token
# https://github.com/marketplace/actions/pypi-publish
# Only run on tagged commits.

name: Publish to test PyPI
on:
  push:
    tags:
      - 'v*.*.*'  # Only run on tags that look like version numbers, e.g. v1.2.3
jobs:
  pypi-publish:
    name: Upload release to test PyPI
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/frame-fm/
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Set Up Python
      uses: astral-sh/setup-uv@v7.2.0
    - name: Build package distributions
      run: |
        uv build --out-dir dist
    - name: Publish package distributions to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        packages-dir: dist/
