name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Test Dependencies
        run: |
          pip install uv
          uv venv
          uv pip install '.[test]'

      - name: Run tests
        run: uv run pytest