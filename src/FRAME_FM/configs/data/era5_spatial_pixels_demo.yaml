_target_: FRAME_FM.dataloaders.ERA5_dataloader.ERA5SpatialPixelsDataModule

# ERA5 source
# Override this at runtime if needed.
data_root: https://gws-access.jasmin.ac.uk/public/eds_ai/era5_repack/aggregations/data/ecmwf-era5X_oper_an_sfc_2000_2020_2d_repack.kr1.0.json
variables: [d2m]
time_min: "2005-01-01T00"
time_max: "2005-01-01T03"

# Tiling
time_slice_size: 2
tile_size_lat: 64
tile_size_lon: 64
convert_longitude_to_180: true
chunks: {time: 1}

# BaseDataModule settings
batch_size: 1
num_workers: 0
pin_memory: true
persistent_workers: false
split_strategy: fraction
train_split: 0.85
val_split: 0.15
test_split: 0.0

debug: true
